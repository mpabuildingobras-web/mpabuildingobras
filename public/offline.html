<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#DC0000" />
    <title>Sem internet | MPA Obras</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #F7F7F7;
        color: #1E1E1E;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .cartao {
        max-width: 360px;
        background: #FFFFFF;
        border: 1px solid #DEDEDE;
        border-radius: 12px;
        padding: 32px 24px;
      }
      img { width: 72px; height: 72px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #5F5F5F; line-height: 1.5; margin: 0 0 24px; }
      button {
        font: inherit;
        font-weight: 600;
        color: #FFFFFF;
        background: #DC0000;
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <img src="/icons/icon-192.png" alt="MPA Building" />
      <h1>Você está offline</h1>
      <p>Os dados aparecem quando a conexão voltar.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
